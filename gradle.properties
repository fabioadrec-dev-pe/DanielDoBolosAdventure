# =============================================================================
# gradle.properties - propriedades centrais de versao do projeto
# -----------------------------------------------------------------------------
# Centralizar versoes aqui evita duplicacao (DRY) e facilita atualizacoes.
# =============================================================================

# Versao do LibGDX (motor grafico 2D usado como base do engine).
gdxVersion=1.13.1

# Versao base da aplicacao (usada por jpackage nos instaladores).
appVersion=1.1.0

# Habilita cache/paralelismo do Gradle para builds mais rapidos.
org.gradle.caching=true
org.gradle.parallel=true

# Memoria da JVM do daemon Gradle.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Extensao de controles (Xbox/Switch/PS/USB generico via SDL).
gdxControllersVersion=2.2.2
