plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fabioad.ddba'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fabio.danieldobolo'
        minSdk 21
        targetSdk 36
        versionCode 117
        versionName project.version.toString()
    }

    signingConfigs {
        release {
            def propsFilePath = project.findProperty('androidKeystorePropertiesFile') ?: 'android/keystore.properties'
            def propsFile = rootProject.file(propsFilePath)
            def props = new Properties()
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            def storeFilePath = project.findProperty('androidStoreFile') ?: props['storeFile']
            def storePasswordValue = project.findProperty('androidStorePassword') ?: props['storePassword']
            def keyAliasValue = project.findProperty('androidKeyAlias') ?: props['keyAlias']
            def keyPasswordValue = project.findProperty('androidKeyPassword') ?: props['keyPassword']
            if (storeFilePath != null) storeFile rootProject.file(storeFilePath)
            if (storePasswordValue != null) storePassword storePasswordValue
            if (keyAliasValue != null) keyAlias keyAliasValue
            if (keyPasswordValue != null) keyPassword keyPasswordValue
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ["${rootProject.projectDir}/assets"]
            res.srcDirs = ['res']
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            debuggable true
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:${gdxControllersVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
    doNotTrackState('Extrai .so das dependencias natives a cada build')
    doFirst {
        file('libs/armeabi-v7a').mkdirs()
        file('libs/arm64-v8a').mkdirs()
        file('libs/x86').mkdirs()
        file('libs/x86_64').mkdirs()
        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
            if (jar.name.endsWith('natives-x86_64.jar')) outputDir = file('libs/x86_64')
            if (jar.name.endsWith('natives-x86.jar')) outputDir = file('libs/x86')
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('JniLibFolders') }.configureEach {
    dependsOn('copyAndroidNatives')
}

tasks.named('preBuild').configure { dependsOn('copyAndroidNatives') }
