/*
 * settings.gradle - multi-projeto LibGDX (core / desktop / android)
 */
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://oss.sonatype.org/content/repositories/snapshots/') }
    }
}

rootProject.name = 'DanielDoBolosAdventure'
include 'core', 'desktop', 'android'
